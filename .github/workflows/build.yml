name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            machine: 0x8664
          - platform: ARM64
            rid: win-arm64
            machine: 0xAA64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Publishing (not just building) compiles the app with Native AOT, which makes it start faster.
      - name: Publish
        run: dotnet publish src/Recto/Recto.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -o out/${{ matrix.rid }}

      - name: Check native binaries and licenses
        shell: pwsh
        run: |
          $out = "out/${{ matrix.rid }}"
          # Recto.pri holds the compiled XAML; the app crashes on launch without it.
          $licenses = "LICENSE.txt", "THIRD-PARTY-NOTICES.md", "WindowsAppSDK-license.txt", "WindowsAppSDK-NOTICE.txt", "dotnet-LICENSE.txt", "dotnet-THIRD-PARTY-NOTICES.txt"
          $licenses += Get-ChildItem licenses/PDFium -File | ForEach-Object { "PDFium/$($_.Name)" }
          foreach ($file in @("Recto.exe", "Recto.pri") + ($licenses | ForEach-Object { "licenses/$_" })) {
            if (-not (Test-Path "$out/$file")) { throw "Missing $file" }
          }
          # The IMAGE_FILE_HEADER machine field must match the target, or the app fails at the first PDFium call.
          $bytes = [IO.File]::ReadAllBytes("$out/pdfium.dll")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne ${{ matrix.machine }}) { throw ("pdfium.dll is for machine 0x{0:X4}" -f $machine) }
          "pdfium.dll machine 0x{0:X4} OK" -f $machine

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/Recto.Tests/Recto.Tests.csproj -c Release

      # The developer tools (docs/tools.md) aren't shipped, but should keep compiling.
      - name: Build tools
        if: matrix.platform == 'x64'
        run: dotnet build tools/Recto.Tools/Recto.Tools.csproj -c Release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Recto-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

  # The Store package: one MSIX per architecture, combined into a bundle for Partner Center.
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Package
        run: |
          dotnet publish src/Recto/Recto.csproj -c Release -p:Platform=x64 -r win-x64 -p:WindowsPackageType=MSIX
          dotnet publish src/Recto/Recto.csproj -c Release -p:Platform=ARM64 -r win-arm64 -p:WindowsPackageType=MSIX

      - name: Bundle
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          $version = ([xml](Get-Content src/Recto/Package.appxmanifest)).Package.Identity.Version
          New-Item -ItemType Directory out/msix | Out-Null
          Copy-Item out/AppPackages/*/*.msix out/msix
          if ((Get-ChildItem out/msix).Count -ne 2) { throw "Expected an x64 and an ARM64 package" }
          # The manifest registers the Explorer thumbnail handler at this path, and it and the app load pdfium.dll from the
          # package root; the license texts ship as in the unpackaged build.
          $required = @("Recto.Thumbnails.dll", "pdfium.dll", "licenses/LICENSE.txt", "licenses/THIRD-PARTY-NOTICES.md", "licenses/dotnet-LICENSE.txt", "licenses/dotnet-THIRD-PARTY-NOTICES.txt")
          $required += Get-ChildItem licenses/PDFium -File | ForEach-Object { "licenses/PDFium/$($_.Name)" }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          foreach ($msix in Get-ChildItem out/msix) {
            $zip = [IO.Compression.ZipFile]::OpenRead($msix.FullName)
            try {
              foreach ($file in $required) { if ($zip.Entries.FullName -notcontains $file) { throw "$($msix.Name) is missing $file" } }
            }
            finally { $zip.Dispose() }
          }
          & $makeappx.FullName bundle /d out/msix /p "out/Recto_$version.msixbundle" /bv $version /o
          if ($LASTEXITCODE) { throw "makeappx failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Recto-msixbundle
          path: out/Recto_*.msixbundle
