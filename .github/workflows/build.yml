name: Build

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: x64
            rid: win-x64
            machine: 0x8664
          - platform: ARM64
            rid: win-arm64
            machine: 0xAA64
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      # Publishing (not just building) compiles the app ReadyToRun, which makes it start faster.
      - name: Publish
        run: dotnet publish src/Folio/Folio.csproj -c Release -p:Platform=${{ matrix.platform }} -r ${{ matrix.rid }} -o out/${{ matrix.rid }}

      - name: Check native binaries and licenses
        shell: pwsh
        run: |
          $out = "out/${{ matrix.rid }}"
          # Folio.pri holds the compiled XAML; the app crashes on launch without it.
          foreach ($file in "Folio.exe", "Folio.pri", "licenses/LICENSE.txt", "licenses/THIRD-PARTY-NOTICES.md", "licenses/PDFium-LICENSE.txt", "licenses/WindowsAppSDK-license.txt") {
            if (-not (Test-Path "$out/$file")) { throw "Missing $file" }
          }
          # The IMAGE_FILE_HEADER machine field must match the target, or the app fails at the first PDFium call.
          $bytes = [IO.File]::ReadAllBytes("$out/pdfium.dll")
          $pe = [BitConverter]::ToInt32($bytes, 0x3C)
          $machine = [BitConverter]::ToUInt16($bytes, $pe + 4)
          if ($machine -ne ${{ matrix.machine }}) { throw ("pdfium.dll is for machine 0x{0:X4}" -f $machine) }
          "pdfium.dll machine 0x{0:X4} OK" -f $machine

      - name: Test
        if: matrix.platform == 'x64'
        run: dotnet test tests/Folio.Tests/Folio.Tests.csproj -c Release

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Folio-${{ matrix.rid }}
          path: out/${{ matrix.rid }}/

  # The Store package: one MSIX per architecture, combined into a bundle for Partner Center.
  msix:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Package
        run: |
          dotnet publish src/Folio/Folio.csproj -c Release -p:Platform=x64 -r win-x64 -p:WindowsPackageType=MSIX
          dotnet publish src/Folio/Folio.csproj -c Release -p:Platform=ARM64 -r win-arm64 -p:WindowsPackageType=MSIX

      - name: Bundle
        shell: pwsh
        run: |
          $makeappx = Get-ChildItem "${env:ProgramFiles(x86)}\Windows Kits\10\bin\*\x64\makeappx.exe" |
            Sort-Object { [version]$_.Directory.Parent.Name } | Select-Object -Last 1
          $version = ([xml](Get-Content src/Folio/Package.appxmanifest)).Package.Identity.Version
          New-Item -ItemType Directory out/msix | Out-Null
          Copy-Item out/AppPackages/*/*.msix out/msix
          if ((Get-ChildItem out/msix).Count -ne 2) { throw "Expected an x64 and an ARM64 package" }
          & $makeappx.FullName bundle /d out/msix /p "out/Folio_$version.msixbundle" /bv $version /o
          if ($LASTEXITCODE) { throw "makeappx failed" }

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: Folio-msixbundle
          path: out/Folio_*.msixbundle
