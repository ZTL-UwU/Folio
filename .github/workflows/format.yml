name: Format

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check-formatting:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: 10.0.x

      - name: Install XamlStyler.Console
        run: dotnet tool install --global XamlStyler.Console --version 3.2501.8

      # Uses Settings.XamlStyler at the repo root. Fix locally with: xstyler -l None -r -d src
      - name: Check XAML formatting
        shell: pwsh
        run: |
          $failed = $false
          foreach ($file in git ls-files '*.xaml') {
            xstyler -p -l None -f $file
            if ($LASTEXITCODE -ne 0) {
              echo "::error file=$file::Format check failed"
              $failed = $true
            }
          }
          if ($failed) { exit 1 }
