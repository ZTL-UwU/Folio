    <clipPath id="page-clip">
      <path d="M64 12H192A32 32 0 0 1 224 44V212A32 32 0 0 1 192 244H64A32 32 0 0 1 32 212V44A32 32 0 0 1 64 12Z"/>
    </clipPath>
    <filter id="ribbon-blur" x="-30%" y="-30%" width="160%" height="160%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="6"/>
      <feOffset dx="4" dy="6"/>
    </filter>
    <linearGradient id="ribbon-fill" x1="0" y1="12" x2="0" y2="122" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#3A8DF0"/>
      <stop offset="1" stop-color="#1663C7"/>
    </linearGradient>
  </defs>
  <!-- Page, with a highlight along its top edge -->
  <path d="M64 12H192A32 32 0 0 1 224 44V212A32 32 0 0 1 192 244H64A32 32 0 0 1 32 212V44A32 32 0 0 1 64 12Z" fill="url(#page-fill)"/>
  <rect x="-64" y="-64" width="384" height="384" fill="url(#page-highlight)" mask="url(#page-edge)"/>
  <!-- Text lines -->
  <rect x="64" y="148" width="104" height="18" rx="9" fill="#0B3A8A" opacity="0.2"/>
  <rect x="64" y="178" width="136" height="18" rx="9" fill="#0B3A8A" opacity="0.2"/>
  <rect x="64" y="208" width="80" height="18" rx="9" fill="#0B3A8A" opacity="0.2"/>
  <!-- Bookmark ribbon, with its shadow on the page -->
