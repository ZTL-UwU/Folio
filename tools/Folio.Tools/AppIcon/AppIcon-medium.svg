<!-- The app icon at 32-48 px: AppIcon-full.svg with thicker, darker text lines.
     After editing, rebuild the icon files with the icon tool; see docs/tools.md. -->
<svg width="256" height="256" viewBox="0 0 256 256" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="page-fill" x1="0" y1="12" x2="0" y2="244" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#E0F1FF"/>
      <stop offset="1" stop-color="#A3D3FF"/>
    </linearGradient>
    <!-- The page's top edge: the page minus a copy moved 2.5 units down. -->
    <mask id="page-edge" maskUnits="userSpaceOnUse" x="-64" y="-64" width="384" height="384">
      <path d="M64 12H192A32 32 0 0 1 224 44V212A32 32 0 0 1 192 244H64A32 32 0 0 1 32 212V44A32 32 0 0 1 64 12Z" fill="white"/>
      <path d="M64 12H192A32 32 0 0 1 224 44V212A32 32 0 0 1 192 244H64A32 32 0 0 1 32 212V44A32 32 0 0 1 64 12Z" fill="black" transform="translate(0 2.5)"/>
    </mask>
    <linearGradient id="page-highlight" x1="0" y1="12" x2="0" y2="132" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#BFE3FF" stop-opacity="1"/>
      <stop offset="1" stop-color="#BFE3FF" stop-opacity="0"/>
